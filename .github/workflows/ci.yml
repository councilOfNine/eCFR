name: CI

# Runs on every push to a long-lived branch and on every pull request, including from forks.
#
# Fork PRs run with a read-only GITHUB_TOKEN and no access to repository secrets. That is the
# correct default and nothing here tries to escape it. `pull_request_target` would run with the
# base branch's permissions and full secret access while checking out code the fork author
# controls — the single most common way a public repo's deploy credentials get exfiltrated. The
# preview job below is gated on the head repo instead, and forks simply do not get one.
on:
  push:
    branches:
      - master
      - 'rebuild/**'
  pull_request:

# Least privilege: nothing in the verify job writes anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `-o pipefail` is not the default for `run:` steps, and the preview step pipes wrangler
# through tee. Without this, a failed upload would report tee's exit status and pass.
defaults:
  run:
    shell: bash

env:
  # ~11,100 prerendered pages is more than the default heap comfortably handles.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # CI never pushes. Leaving the token in .git/config just widens the blast radius of a
          # compromised build script.
          persist-credentials: false

      # No `version:` input on purpose — the action reads `packageManager` from the root
      # package.json, so CI and every contributor's machine run the same pnpm by construction
      # rather than by two places agreeing.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Biome runs format + lint + the GritQL no-dynamic-RegExp plugin in one pass.
      # `biome ci` is the CI-mode equivalent of `biome check`: read-only, fails on any error.
      - name: Lint and format (Biome)
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm typecheck` is `tsc --build` over the root solution config, and apps/web is
      # deliberately not one of its references: it extends astro/tsconfigs/strict and half its
      # types do not exist until `astro sync` has generated them. Without this second step the
      # whole Astro app — every page, every component, the entire src/data layer — is never
      # typechecked in CI at all. `astro check` does the sync itself.
      - name: Typecheck the site
        run: pnpm --filter @ecfr-atlas/web typecheck

      - name: Test
        run: pnpm test

      # Explicitly fixture-backed. CI has no snapshot and no D1, so apps/web would fall back to
      # the fixture anyway — saying so out loud means the build cannot accidentally pick up a
      # stray local database and produce a result that depends on the runner's disk. Every page
      # in a fixture build is banner-marked as invented, which is exactly right for CI.
      - name: Build site
        env:
          ECFR_USE_FIXTURE: '1'
        run: pnpm build

      # The deploy-time failure this prevents costs an entire nightly run: by the time wrangler
      # rejects the upload, D1 and R2 have already been written. See the script header.
      - name: Assert static-asset budget
        run: node scripts/ci/check-asset-count.ts apps/web/dist/client

      - name: Upload asset budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asset-budget
          path: asset-budget.json
          if-no-files-found: ignore
          retention-days: 14

  # Forks get told why there is no preview link, rather than being left to wonder whether
  # something failed silently.
  preview-skipped:
    name: preview (skipped for forks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain
        run: |
          {
            echo "## No preview deployment for this PR"
            echo
            echo "This pull request comes from a fork, so it runs without repository secrets"
            echo "and cannot deploy to Cloudflare. That is intentional: the alternative"
            echo "(\`pull_request_target\`) would hand our deploy credentials to code from the"
            echo "fork. The **verify** job still builds the site in full, so a broken build"
            echo "will still fail this PR."
            echo
            echo "A maintainer can produce a preview by pushing the branch to this repository."
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: preview deploy
    needs: verify
    # Same-repo pull requests only. `head.repo.fork` is false for branches pushed here.
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Solely to post the preview URL onto the PR.
      pull-requests: write
    steps:
      # Secrets cannot be referenced in a job-level `if:`, so the gate lives here. A clone of
      # this repo with no Cloudflare account should get a clean skip, not a confusing red X.
      - name: Check Cloudflare credentials
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set; skipping preview deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - if: steps.gate.outputs.configured == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # Fixture-backed, same as `verify`. A preview built from the committed fixture shows the
      # PR's layout and routing changes; it is not, and must not be mistaken for, real data.
      # Every page in a fixture build carries a banner saying so.
      - if: steps.gate.outputs.configured == 'true'
        env:
          ECFR_USE_FIXTURE: '1'
        run: pnpm build

      # `versions upload` publishes a non-live version and prints a preview URL. It never
      # shifts production traffic, so a bad PR cannot take the site down.
      - name: Upload preview version
        id: upload
        if: steps.gate.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload \
            --config apps/web/wrangler.jsonc \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.sha }}" \
            | tee upload.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' upload.log | head -n1 || true)"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler did not print a preview URL; see the upload log above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment preview URL
        if: steps.gate.outputs.configured == 'true' && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "Preview for \`${{ github.sha }}\`: $URL

          Unrouted Worker version — production traffic is untouched. Built from the committed
          fixture, so every figure on it is invented and the pages say so. Use it to review
          layout and routing, not numbers."
